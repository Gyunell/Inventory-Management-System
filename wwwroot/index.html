<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <main class="container">
        <header class="page-header">
            <div class="title-area">
                <div>
                    <h1>Inventory Management</h1>
                    <p>Keep track of your products</p>
                </div>
            </div>
        </header>

        <section class="dashboard">
            <div class="stat-card products-card">
                <div class="stat-icon">
                    <i data-lucide="package"></i>
                </div>
                <div class="stat-content">
                    <span>Total Products</span>
                    <strong id="totalProducts">0</strong>
                </div>
            </div>

            <div class="stat-card quantity-card">
                <div class="stat-icon">
                    <i data-lucide="boxes"></i>
                </div>
                <div class="stat-content">
                    <span>Total Quantity</span>
                    <strong id="totalQuantity">0</strong>
                </div>
            </div>


            <div class="stat-card value-card">
                <div class="stat-icon">
                    <i data-lucide="circle-dollar-sign"></i>
                </div>
                <div class="stat-content">
                    <span>Inventory Value</span>
                    <strong id="inventoryValue">$0</strong>
                </div>
            </div>

        </section>

        <section class="products-section">
            <div class="section-header">
                <div class="section-title">
                    <div>
                        <h2>Products</h2>
                        <p>Manage your inventory</p>
                    </div>
                </div>

                <button id="addProductBtn" class="add-button" type="button">
                    <i data-lucide="plus"></i>
                    Add Product
                </button>
            </div>


            <div class="filters">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search products..."
                    >
                </div>

                <div class="category-box">
                    <i data-lucide="list-filter"></i>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
            </div>


            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productsTable">
                    </tbody>

                </table>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <i data-lucide="package-open"></i>
                    </div>

                    <h3>No products here!</h3>

                    <p>
                        Add your first ever product to get started.
                    </p>
                </div>
            </div>
        </section>

    </main>

    <div id="productModal" class="product-modal" hidden>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    
            <div class="modal-header">
                <h2 id="modalTitle">Add Product</h2>
            </div>
    
            <form id="productForm">
                <input type="hidden" id="productId">
    
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" maxlength="100" placeholder="Enter product name" required>
                </div>
    
                <div class="form-group">
                    <label for="productCategory">Category</label>
                    <input type="text" id="productCategory" maxlength="50" placeholder="e.g. Electronics" required>
                </div>
    
                <div class="form-row">
                    <div class="form-group">
                        <label for="productPrice">Price ($)</label>
                        <input type="number" id="productPrice" min="0" max="1000000" step="0.01" placeholder="0.00"
                            required>
                    </div>
    
                    <div class="form-group">
                        <label for="productQuantity">Quantity</label>
                        <input type="number" id="productQuantity" min="0" max="1000000" step="1" placeholder="0" required>
                    </div>
                </div>
    
                <div class="modal-actions">
                    <button type="button" id="cancelProductBtn" class="cancel-button">
                        Cancel Product
                    </button>
    
                    <button type="submit" id="saveProductBtn" class="save-button">
                        Save Product
                    </button>
                </div>
            </form>
    
        </section>
    </div>
    
    <div id="messageBox" class="message-box" role="status" hidden></div>

    <script src="js/app.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
